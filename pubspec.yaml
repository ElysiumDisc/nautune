name: nautune
description: "Nautune - Poseidon Music Player for Jellyfin"
publish_to: 'none'

version: 9.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.0
  google_fonts: ^8.0.0
  package_info_plus: ^10.1.0
  flutter_cache_manager: ^3.4.1
  
  # Audio playback via AVFoundation (audioplayers_darwin)
  audioplayers: ^6.1.0
  audio_session: ^0.2.2
  audio_service: ^0.18.15
  flutter_carplay: ^1.1.4
  connectivity_plus: ^7.0.0
  battery_plus: ^7.0.0  # iOS Low Power Mode detection
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  rxdart: ^0.28.0
  audio_video_progress_bar: ^2.0.3
  material_color_utilities: ^0.13.0
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.6  # Last.fm request signing (md5)
  flutter_local_notifications: ^21.0.0
  uuid: ^4.5.2
  flutter_colorpicker: ^1.1.0
  just_waveform: ^0.0.7  # iOS waveform extraction
  url_launcher: ^6.2.5  # Open URLs in browser
  fftea: ^1.1.0  # Pure Dart FFT/STFT for Frets on Fire chart generation
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/demo/demo_offline_track.mp3
    - assets/demo/demo_online_track.mp3
    - assets/icon.png
    - assets/no_album_art.png
    - assets/no_artist_art.png
    - assets/relax/
    - assets/images/
    - assets/fire/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
